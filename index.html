<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日历记账</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日历记账">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --text: #f2f2f7;
    --muted: #8e8e93;
    --accent: #0a84ff;
    --red: #ff453a;
    --green: #30d158;
    --white: #ffffff;
    --glass: rgba(30,30,34,0.55);
    --glass-border: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
    background: #000000;
    background-attachment: fixed;
  }
  /* 背景装饰光斑（深色） */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(circle at 20% 15%, rgba(10,132,255,0.18) 0%, transparent 45%),
      radial-gradient(circle at 85% 25%, rgba(94,92,230,0.15) 0%, transparent 45%),
      radial-gradient(circle at 50% 85%, rgba(255,69,58,0.10) 0%, transparent 50%);
  }
  .wrap { max-width: 520px; margin: 0 auto; position: relative; z-index: 1; }

  /* 顶部统计栏 */
  .stats { display: flex; gap: 10px; padding: 20px 16px 8px; }
  .stat-card {
    flex: 1; border-radius: 20px; padding: 14px; text-align: center;
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .stat-card .label { font-size: 12px; color: var(--muted); }
  .stat-card .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
  .stat-card .value.red { color: var(--red); }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.white { color: var(--white); }

  /* 月份导航 */
  .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
  .month-nav .title { font-size: 22px; font-weight: 700; }
  .month-nav button {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--glass-border);
    background: var(--glass); font-size: 20px; cursor: pointer; color: var(--accent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .month-nav button:hover { background: rgba(60,60,67,0.8); }

  /* 星期表头 */
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); padding: 4px 20px; text-align: center; }
  .weekdays span { font-size: 12px; color: var(--muted); padding: 4px 0; font-weight: 600; }
  .weekdays span.weekend { color: var(--red); }

  /* 日历网格 */
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 16px; gap: 6px; }
  .day {
    aspect-ratio: 1; border-radius: 16px; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; transition: .12s; background: transparent;
  }
  .day:hover { background: rgba(255,255,255,0.08); }
  .day.empty { cursor: default; }
  .day.empty:hover { background: transparent; }
  .day .date { font-weight: 500; }
  .day.today .date {
    background: var(--accent); color: #fff; width: 30px; height: 30px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(10,132,255,0.5);
  }
  .day.selected {
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .day.selected .date { color: var(--accent); font-weight: 700; }
  .day .amount {
    font-size: 9px; margin-top: 1px; font-weight: 600;
    max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .day .amount.green { color: var(--green); }
  .day .amount.red { color: var(--red); }
  .day .amount.white { color: var(--white); }
  .day.other-month { opacity: 0.35; }

  /* 当天详情面板 */
  .detail {
    margin: 16px; border-radius: 24px; padding: 18px;
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .detail .detail-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .detail .detail-total { font-size: 13px; color: var(--muted); margin-bottom: 12px; }

  .item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .item:last-child { border-bottom: none; }
  .item .info { flex: 1; }
  .item .name { font-size: 15px; font-weight: 500; }
  .item .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .item .money { font-size: 16px; font-weight: 700; color: var(--green); }
  .item .del {
    margin-left: 12px; width: 28px; height: 28px; border-radius: 50%;
    border: none; background: rgba(255,69,58,0.15); color: var(--red); font-size: 16px;
    cursor: pointer; line-height: 1;
  }
  .item .del:hover { background: rgba(255,69,58,0.3); }

  /* 添加表单 */
  .add-form { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .add-form input {
    padding: 11px; border: 1px solid var(--glass-border); border-radius: 12px;
    font-size: 14px; flex: 1; min-width: 0;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: var(--text);
  }
  .add-form input::placeholder { color: #636366; }
  .add-form input.name { flex: 2; }
  .add-form input.money { flex: 1; }
  .add-form button {
    padding: 11px 18px; background: var(--accent); color: #fff;
    border: none; border-radius: 12px; font-size: 14px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(10,132,255,0.4);
  }
  .add-form button:hover { background: #0063d1; }

  .empty-tip { text-align: center; color: var(--muted); font-size: 13px; padding: 16px 0; }

  /* 统计面板 */
  .chart-panel {
    margin: 16px; border-radius: 24px; padding: 18px;
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .chart-panel h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .chart-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .chart-tabs button {
    flex: 1; padding: 8px; border: 1px solid var(--glass-border); border-radius: 10px;
    background: rgba(255,255,255,0.06); color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .chart-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chart-canvas-box { width: 100%; overflow: hidden; }
  canvas#chart { width: 100%; height: 180px; display: block; }

  /* 同比环比 */
  .yoy-mom { display: flex; gap: 10px; margin-top: 12px; }
  .yoy-mom .box {
    flex: 1; padding: 10px; border-radius: 12px; text-align: center;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border);
  }
  .yoy-mom .box .lbl { font-size: 11px; color: var(--muted); }
  .yoy-mom .box .val { font-size: 15px; font-weight: 700; margin-top: 3px; }
  .yoy-mom .box .val.up { color: var(--green); }
  .yoy-mom .box .val.down { color: var(--red); }
  .yoy-mom .box .val.flat { color: var(--white); }

  /* 回看面板 */
  select option { background: #1c1c1e; color: #f2f2f7; }
  .history-day {
    display: flex; align-items: center; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .history-day:last-child { border-bottom: none; }
  .history-day .d { width: 60px; font-size: 13px; color: var(--muted); }
  .history-day .cnt { flex: 1; font-size: 12px; color: var(--muted); }
  .history-day .amt { font-size: 14px; font-weight: 700; }
  .history-day .amt.green { color: var(--green); }
  .history-day .amt.red { color: var(--red); }
  .history-day .amt.white { color: var(--white); }
  .cat-title { font-size: 12px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
  .cat-row {
    display: flex; align-items: center; padding: 9px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .cat-row:last-child { border-bottom: none; }
  .cat-row .cat-name { flex: 1; font-size: 14px; }
  .cat-row .cat-count { font-size: 12px; color: var(--muted); margin-right: 10px; }
  .cat-row .cat-amt { font-size: 15px; font-weight: 700; }
  .cat-row .cat-amt.green { color: var(--green); }
  .cat-row .cat-amt.red { color: var(--red); }
  .cat-row .cat-amt.white { color: var(--white); }

  /* 年度备注统计 */
  .year-rank { margin-top: 4px; }
  .rank-row { margin-bottom: 10px; }
  .rank-row:last-child { margin-bottom: 0; }
  .rank-top { display: flex; align-items: baseline; margin-bottom: 4px; }
  .rank-top .rank-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-top .rank-count { font-size: 12px; color: var(--muted); margin-right: 10px; }
  .rank-top .rank-amt { font-size: 15px; font-weight: 700; }
  .rank-top .rank-amt.green { color: var(--green); }
  .rank-top .rank-amt.red { color: var(--red); }
  .rank-top .rank-amt.white { color: var(--white); }
  .rank-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .rank-bar .fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .3s; }
  .rank-bar .fill.green { background: var(--green); }
  .rank-bar .fill.red { background: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <!-- 统计栏 -->
  <div class="stats">
    <div class="stat-card">
      <div class="label">日总额</div>
      <div class="value" id="statDay">¥0</div>
    </div>
    <div class="stat-card">
      <div class="label">月总额</div>
      <div class="value" id="statMonth">¥0</div>
    </div>
    <div class="stat-card">
      <div class="label">年总额</div>
      <div class="value" id="statYear">¥0</div>
    </div>
  </div>

  <!-- 月份导航 -->
  <div class="month-nav">
    <button id="prevMonth">‹</button>
    <div class="title" id="monthTitle">2026年8月</div>
    <button id="nextMonth">›</button>
  </div>

  <!-- 星期表头 -->
  <div class="weekdays">
    <span class="weekend">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="weekend">六</span>
  </div>

  <!-- 日历 -->
  <div class="calendar" id="calendar"></div>

  <!-- 当天详情 -->
  <div class="detail" id="detail" style="display:none;">
    <div class="detail-title" id="detailTitle"></div>
    <div class="detail-total" id="detailTotal"></div>
    <div id="itemList"></div>
    <div class="add-form">
      <input type="text" class="name" id="inputName" placeholder="项目名称">
      <input type="number" class="money" id="inputMoney" placeholder="金额">
      <input type="text" id="inputNote" placeholder="备注(可选)">
      <button id="addBtn">添加</button>
    </div>
  </div>

  <!-- 历史回看 -->
  <div class="chart-panel" id="historyPanel">
    <h3>历史回看</h3>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <select id="historyYear" style="flex:1; padding:10px; border:1px solid var(--glass-border); border-radius:10px; background:rgba(255,255,255,0.08); color:var(--text); font-size:14px;"></select>
      <select id="historyMonth" style="flex:1; padding:10px; border:1px solid var(--glass-border); border-radius:10px; background:rgba(255,255,255,0.08); color:var(--text); font-size:14px;"></select>
    </div>
    <div class="yoy-mom" style="margin-top:0;">
      <div class="box">
        <div class="lbl">该年总额</div>
        <div class="val" id="historyYearTotal">¥0</div>
      </div>
      <div class="box">
        <div class="lbl">该月总额</div>
        <div class="val" id="historyMonthTotal">¥0</div>
      </div>
    </div>
    <div id="historyMonthDays" style="margin-top:12px;"></div>
    <div id="historyCategory" style="margin-top:12px;"></div>
    <div style="display:flex; gap:8px; margin-top:16px;">
      <button id="exportBtn" style="flex:1; padding:10px; border:1px solid var(--glass-border); border-radius:10px; background:rgba(255,255,255,0.08); color:var(--text); font-size:13px; cursor:pointer;">⬇ 导出数据</button>
      <button id="importBtn" style="flex:1; padding:10px; border:1px solid var(--glass-border); border-radius:10px; background:rgba(255,255,255,0.08); color:var(--text); font-size:13px; cursor:pointer;">⬆ 导入数据</button>
      <input type="file" id="importFile" accept=".json" style="display:none;">
    </div>
  </div>

  <!-- 年度备注统计 -->
  <div class="chart-panel">
    <h3>📈 年度备注统计</h3>
    <div class="yoy-mom" style="margin-top:0;">
      <div class="box">
        <div class="lbl">年度总笔数</div>
        <div class="val" id="yearRankCount">0</div>
      </div>
      <div class="box">
        <div class="lbl">分类数</div>
        <div class="val" id="yearRankCat">0</div>
      </div>
    </div>
    <div class="year-rank" id="yearRankBox" style="margin-top:12px;"></div>
  </div>

  <!-- 统计面板 -->
  <div class="chart-panel">
    <h3>统计趋势</h3>
    <div class="chart-tabs">
      <button id="tabMonth" class="active">月趋势</button>
      <button id="tabDay">日趋势</button>
    </div>
    <div class="chart-canvas-box">
      <canvas id="chart"></canvas>
    </div>
    <div class="yoy-mom">
      <div class="box">
        <div class="lbl">同比（去年同月）</div>
        <div class="val" id="yoyVal">--</div>
      </div>
      <div class="box">
        <div class="lbl">环比（上月）</div>
        <div class="val" id="momVal">--</div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'calendar_v1';
  let data = loadData();
  let viewYear, viewMonth;
  let selectedDate = null;
  let chartMode = 'month'; // 'month' | 'day'
  let editingId = null; // 正在编辑的条目 id

  function loadData(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

  function fmtDate(y,m,d){ return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  function todayStr(){ const t=new Date(); return fmtDate(t.getFullYear(),t.getMonth()+1,t.getDate()); }

  function dayTotal(dateStr){
    const items = data[dateStr] || [];
    return items.reduce((s,it)=> s+(Number(it.money)||0), 0);
  }

  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth()+1;
  selectedDate = todayStr();

  function fmtMoney(n){
    return '¥' + n.toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2});
  }

  // 单日金额颜色规则
  function dayColor(total){
    if(total > 1000) return 'green';
    if(total === 1000) return 'white';
    return 'red';
  }

  function updateStats(){
    const dayT = dayTotal(selectedDate);
    const dayEl = document.getElementById('statDay');
    dayEl.textContent = fmtMoney(dayT);
    dayEl.className = 'value ' + dayColor(dayT);

    let monthTotal = 0;
    Object.keys(data).forEach(k=>{ if(k.startsWith(viewYear+'-'+String(viewMonth).padStart(2,'0'))) monthTotal += dayTotal(k); });
    const monthEl = document.getElementById('statMonth');
    monthEl.textContent = fmtMoney(monthTotal);
    monthEl.className = 'value ' + dayColor(monthTotal);

    let yearTotal = 0;
    Object.keys(data).forEach(k=>{ if(k.startsWith(viewYear+'-')) yearTotal += dayTotal(k); });
    const yearEl = document.getElementById('statYear');
    yearEl.textContent = fmtMoney(yearTotal);
    yearEl.className = 'value ' + dayColor(yearTotal);

    updateYoYMoM();
  }

  // 同比环比
  function updateYoYMoM(){
    // 本月总额
    const curMonth = monthTotal(viewYear, viewMonth);
    // 上月总额
    let prevY = viewYear, prevM = viewMonth-1;
    if(prevM < 1){ prevM = 12; prevY--; }
    const lastMonth = monthTotal(prevY, prevM);
    // 去年同月
    const lastYear = monthTotal(viewYear-1, viewMonth);

    const momEl = document.getElementById('momVal');
    const yoyEl = document.getElementById('yoyVal');

    momEl.textContent = pctText(curMonth, lastMonth);
    momEl.className = 'val ' + trendClass(curMonth, lastMonth);
    yoyEl.textContent = pctText(curMonth, lastYear);
    yoyEl.className = 'val ' + trendClass(curMonth, lastYear);
  }

  function monthTotal(y, m){
    let t = 0;
    Object.keys(data).forEach(k=>{ if(k.startsWith(y+'-'+String(m).padStart(2,'0'))) t += dayTotal(k); });
    return t;
  }

  function monthCount(y, m){
    let c = 0;
    Object.keys(data).forEach(k=>{ if(k.startsWith(y+'-'+String(m).padStart(2,'0'))) c += (data[k]||[]).length; });
    return c;
  }

  function pctText(cur, prev){
    if(prev === 0){ return cur === 0 ? '--' : '新增'; }
    const pct = ((cur - prev) / prev * 100);
    const sign = pct > 0 ? '+' : '';
    return sign + pct.toFixed(1) + '%';
  }
  function trendClass(cur, prev){
    if(prev === 0) return 'flat';
    if(cur > prev) return 'up';
    if(cur < prev) return 'down';
    return 'flat';
  }

  // 日历渲染
  function renderCalendar(){
    document.getElementById('monthTitle').textContent = viewYear+'年'+viewMonth+'月';
    const cal = document.getElementById('calendar');
    cal.innerHTML = '';
    const firstDay = new Date(viewYear, viewMonth-1, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
    const daysInPrev = new Date(viewYear, viewMonth-1, 0).getDate();

    for(let i=0;i<firstDay;i++){
      const d = daysInPrev-firstDay+1+i;
      const cell = document.createElement('div');
      cell.className = 'day empty other-month';
      cell.innerHTML = '<span class="date">'+d+'</span>';
      cal.appendChild(cell);
    }
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = fmtDate(viewYear, viewMonth, d);
      const cell = document.createElement('div');
      cell.className = 'day';
      if(dateStr === todayStr()) cell.classList.add('today');
      if(dateStr === selectedDate) cell.classList.add('selected');
      const total = dayTotal(dateStr);
      let html = '<span class="date">'+d+'</span>';
      if(total > 0) html += '<span class="amount '+dayColor(total)+'">'+fmtMoney(total)+'</span>';
      cell.innerHTML = html;
      cell.addEventListener('click', ()=> selectDate(dateStr));
      cal.appendChild(cell);
    }
    const totalCells = firstDay + daysInMonth;
    const remaining = (7 - totalCells%7)%7;
    for(let i=1;i<=remaining;i++){
      const cell = document.createElement('div');
      cell.className = 'day empty other-month';
      cell.innerHTML = '<span class="date">'+i+'</span>';
      cal.appendChild(cell);
    }
  }

  function selectDate(dateStr){
    selectedDate = dateStr;
    renderCalendar();
    renderDetail();
    updateStats();
  }

  function renderDetail(){
    const detail = document.getElementById('detail');
    detail.style.display = 'block';
    const [y,m,d] = selectedDate.split('-').map(Number);
    const week = ['日','一','二','三','四','五','六'][new Date(y,m-1,d).getDay()];
    document.getElementById('detailTitle').textContent = m+'月'+d+'日 星期'+week;
    const total = dayTotal(selectedDate);
    document.getElementById('detailTotal').textContent = '当日合计：'+fmtMoney(total)+'（'+({green:'达标',white:'持平',red:'未达标'}[dayColor(total)])+'）';

    const list = document.getElementById('itemList');
    list.innerHTML = '';
    const items = data[selectedDate] || [];
    if(items.length === 0){
      list.innerHTML = '<div class="empty-tip">暂无记录，添加第一条吧</div>';
    } else {
      items.forEach(it=>{
        const div = document.createElement('div');
        div.className = 'item';
        let noteHtml = it.note ? '<div class="note">'+escapeHtml(it.note)+'</div>' : '';
        div.innerHTML = '<div class="info"><div class="name">'+escapeHtml(it.name)+'</div>'+noteHtml+'</div>'+
          '<div class="money">'+fmtMoney(Number(it.money)||0)+'</div>'+
          '<button class="del edit" data-id="'+it.id+'">✎</button>'+
          '<button class="del" data-id="'+it.id+'">×</button>';
        div.querySelector('.del.edit').addEventListener('click', ()=> editItem(it.id));
        div.querySelector('.del:not(.edit)').addEventListener('click', ()=> deleteItem(it.id));
        list.appendChild(div);
      });
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function addItem(){
    const name = document.getElementById('inputName').value.trim();
    const money = document.getElementById('inputMoney').value.trim();
    const note = document.getElementById('inputNote').value.trim();
    if(!name){ alert('请输入项目名称'); return; }
    if(!money || isNaN(Number(money))){ alert('请输入有效金额'); return; }

    if(editingId){
      // 编辑模式：更新现有条目
      const items = data[selectedDate] || [];
      const idx = items.findIndex(it=>it.id===editingId);
      if(idx >= 0){
        items[idx] = { id: editingId, name, money:Number(money), note };
        saveData();
      }
      editingId = null;
      document.getElementById('addBtn').textContent = '添加';
    } else {
      // 新增模式
      if(!data[selectedDate]) data[selectedDate] = [];
      data[selectedDate].push({ id: Date.now()+''+Math.random(), name, money:Number(money), note });
      saveData();
    }
    document.getElementById('inputName').value='';
    document.getElementById('inputMoney').value='';
    document.getElementById('inputNote').value='';
    renderCalendar(); renderDetail(); updateStats(); renderChart(); initHistorySelects(); renderHistory(); renderYearRank();
  }

  function editItem(id){
    const items = data[selectedDate] || [];
    const it = items.find(x=>x.id===id);
    if(!it) return;
    editingId = id;
    document.getElementById('inputName').value = it.name;
    document.getElementById('inputMoney').value = it.money;
    document.getElementById('inputNote').value = it.note || '';
    document.getElementById('addBtn').textContent = '保存';
    document.getElementById('inputName').focus();
  }

  function deleteItem(id){
    if(!data[selectedDate]) return;
    data[selectedDate] = data[selectedDate].filter(it=>it.id!==id);
    if(data[selectedDate].length===0) delete data[selectedDate];
    saveData();
    if(editingId === id){ editingId = null; document.getElementById('addBtn').textContent = '添加'; }
    renderCalendar(); renderDetail(); updateStats(); renderChart(); renderHistory(); renderYearRank();
  }

  // 图表
  function renderChart(){
    const canvas = document.getElementById('chart');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.parentElement.clientWidth;
    const h = chartMode === 'day' ? 220 : 180;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w+'px';
    canvas.style.height = h+'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    let labels = [], values = [];
    if(chartMode === 'month'){
      // 近12个月
      for(let i=11;i>=0;i--){
        let y = viewYear, m = viewMonth - i;
        while(m < 1){ m += 12; y--; }
        while(m > 12){ m -= 12; y++; }
        labels.push(m+'月');
        values.push(monthTotal(y, m));
      }
    } else {
      // 近30天
      for(let i=29;i>=0;i--){
        const d = new Date();
        d.setDate(d.getDate()-i);
        const ds = fmtDate(d.getFullYear(), d.getMonth()+1, d.getDate());
        labels.push(d.getMonth()+1+'/'+d.getDate());
        values.push(dayTotal(ds));
      }
    }

    drawLineChart(ctx, w, h, labels, values);
  }

  function drawLineChart(ctx, w, h, labels, values){
    ctx.clearRect(0,0,w,h);
    const isDay = (chartMode === 'day');
    const padL = 40, padR = 10, padT = isDay ? 20 : 15, padB = 25;
    const plotW = w - padL - padR;
    const plotH = h - padT - padB;
    const maxV = Math.max(...values, 1);

    // 网格线
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for(let i=0;i<=4;i++){
      const y = padT + plotH*i/4;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w-padR, y); ctx.stroke();
      ctx.fillStyle = '#8e8e93';
      ctx.font = '10px -apple-system, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(fmtShort(maxV*(1-i/4)), padL-4, y+3);
    }

    const n = values.length;
    const stepX = n>1 ? plotW/(n-1) : plotW;
    const px = i => padL + i*stepX;
    const py = v => padT + plotH*(1 - v/maxV);

    // 渐变填充
    const grad = ctx.createLinearGradient(0,padT,0,padT+plotH);
    grad.addColorStop(0,'rgba(10,132,255,0.3)');
    grad.addColorStop(1,'rgba(10,132,255,0)');
    ctx.beginPath();
    values.forEach((v,i)=>{
      const x = px(i), y = py(v);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.lineTo(px(n-1), padT+plotH);
    ctx.lineTo(px(0), padT+plotH);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // 折线（发光 + 加粗）
    ctx.save();
    ctx.strokeStyle = '#0a84ff';
    ctx.lineWidth = isDay ? 2.5 : 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(10,132,255,0.7)';
    ctx.shadowBlur = isDay ? 8 : 4;
    ctx.beginPath();
    values.forEach((v,i)=>{
      const x = px(i), y = py(v);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    ctx.restore();

    // 数据点：有数据高亮，无数据弱化
    values.forEach((v,i)=>{
      const x = px(i), y = py(v);
      if(v > 0){
        // 外圈光晕
        ctx.fillStyle = 'rgba(10,132,255,0.25)';
        ctx.beginPath(); ctx.arc(x,y, isDay?6:4, 0, Math.PI*2); ctx.fill();
        // 实心点
        ctx.fillStyle = '#0a84ff';
        ctx.beginPath(); ctx.arc(x,y, isDay?3.5:2.5, 0, Math.PI*2); ctx.fill();
        // 白心
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(x,y, isDay?1.5:1, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.beginPath(); ctx.arc(x,y, 1.5, 0, Math.PI*2); ctx.fill();
      }
    });

    // 日趋势：在数据点上方标注金额
    if(isDay){
      ctx.font = '9px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      values.forEach((v,i)=>{
        if(v <= 0) return;
        const x = px(i), y = py(v);
        ctx.fillStyle = '#f2f2f7';
        ctx.fillText(fmtShort(v), x, y - 8);
      });
    }

    // X轴标签
    ctx.fillStyle = '#8e8e93';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    const labelStep = isDay ? Math.max(1, Math.ceil(n/10)) : Math.ceil(n/8);
    labels.forEach((lb,i)=>{
      if(i%labelStep===0 || i===n-1){
        ctx.fillText(lb, px(i), h-8);
      }
    });
  }

  function fmtShort(v){
    if(v >= 10000) return (v/10000).toFixed(1)+'w';
    if(v >= 1000) return (v/1000).toFixed(1)+'k';
    return Math.round(v)+'';
  }

  // ---------- 历史回看 ----------
  let historyYear = viewYear;
  let historyMonth = viewMonth;

  // 获取数据里出现过的所有年份（升序）
  function allYears(){
    const years = new Set();
    Object.keys(data).forEach(k=>{
      const y = k.split('-')[0];
      if(y) years.add(Number(y));
    });
    years.add(now.getFullYear());
    return [...years].sort((a,b)=>a-b);
  }

  function initHistorySelects(){
    const ySel = document.getElementById('historyYear');
    const mSel = document.getElementById('historyMonth');
    ySel.innerHTML = '';
    allYears().forEach(y=>{
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y+'年';
      if(y === historyYear) opt.selected = true;
      ySel.appendChild(opt);
    });
    mSel.innerHTML = '';
    const allOpt = document.createElement('option');
    allOpt.value = '0'; allOpt.textContent = '全年';
    mSel.appendChild(allOpt);
    for(let m=1; m<=12; m++){
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m+'月';
      if(m === historyMonth) opt.selected = true;
      mSel.appendChild(opt);
    }
  }

  function renderHistory(){
    const isYear = (historyMonth === 0);
    const mTotal = isYear ? 0 : monthTotal(historyYear, historyMonth);
    let yTotal = 0;
    Object.keys(data).forEach(k=>{ if(k.startsWith(historyYear+'-')) yTotal += dayTotal(k); });

    const mEl = document.getElementById('historyMonthTotal');
    mEl.textContent = isYear ? '全年' : fmtMoney(mTotal);
    mEl.className = 'val ' + (isYear ? 'white' : dayColor(mTotal));
    const yEl = document.getElementById('historyYearTotal');
    yEl.textContent = fmtMoney(yTotal);
    yEl.className = 'val ' + dayColor(yTotal);

    // 该月/全年每天明细
    const box = document.getElementById('historyMonthDays');
    box.innerHTML = '';
    let hasData = false;
    if(isYear){
      // 全年：按月份汇总展示，每月一行
      for(let m=1; m<=12; m++){
        const mt = monthTotal(historyYear, m);
        const cnt = monthCount(historyYear, m);
        if(cnt === 0) continue;
        hasData = true;
        const div = document.createElement('div');
        div.className = 'history-day';
        div.innerHTML = '<div class="d">'+m+'月</div>' +
          '<div class="cnt">'+cnt+'笔</div>' +
          '<div class="amt '+dayColor(mt)+'">'+fmtMoney(mt)+'</div>';
        box.appendChild(div);
      }
    } else {
      const daysInMonth = new Date(historyYear, historyMonth, 0).getDate();
      for(let d=1; d<=daysInMonth; d++){
        const ds = fmtDate(historyYear, historyMonth, d);
        const items = data[ds] || [];
        if(items.length === 0) continue;
        hasData = true;
        const total = dayTotal(ds);
        const div = document.createElement('div');
        div.className = 'history-day';
        div.innerHTML = '<div class="d">'+historyMonth+'/'+d+'日</div>' +
          '<div class="cnt">'+items.length+'笔</div>' +
          '<div class="amt '+dayColor(total)+'">'+fmtMoney(total)+'</div>';
        box.appendChild(div);
      }
    }
    if(!hasData){
      box.innerHTML = '<div class="empty-tip">'+(isYear?'该年':'该月')+'暂无记录</div>';
    }

    // 按备注/项目名归类汇总
    renderCategory(historyYear, historyMonth);
  }

  function renderCategory(y, m){
    const catBox = document.getElementById('historyCategory');
    catBox.innerHTML = '';
    const isYear = (m === 0);
    // 归类：备注为空按项目名，有备注按备注
    const catMap = {}; // key -> { total, count }
    const daysInMonth = isYear ? 0 : new Date(y, m, 0).getDate();
    const months = isYear ? 12 : 1;
    const startM = isYear ? 1 : m;
    for(let i=0; i<months; i++){
      const mm = startM + i;
      const dim = new Date(y, mm, 0).getDate();
      for(let d=1; d<=dim; d++){
        const ds = fmtDate(y, mm, d);
        const items = data[ds] || [];
        items.forEach(it=>{
          const key = (it.note && it.note.trim()) ? it.note.trim() : it.name;
          if(!catMap[key]) catMap[key] = { total:0, count:0 };
          catMap[key].total += (Number(it.money)||0);
          catMap[key].count++;
        });
      }
    }
    const keys = Object.keys(catMap);
    if(keys.length === 0){
      catBox.innerHTML = '';
      return;
    }
    // 按总额降序
    keys.sort((a,b)=> catMap[b].total - catMap[a].total);
    catBox.innerHTML = '<div class="cat-title">📊 ' + (isYear?'按备注分类汇总（全年）':'按备注分类汇总') + '</div>';
    keys.forEach(key=>{
      const c = catMap[key];
      const div = document.createElement('div');
      div.className = 'cat-row';
      div.innerHTML = '<div class="cat-name">'+escapeHtml(key)+'</div>' +
        '<div class="cat-count">'+c.count+'笔</div>' +
        '<div class="cat-amt '+dayColor(c.total)+'">'+fmtMoney(c.total)+'</div>';
      catBox.appendChild(div);
    });
  }

  // 年度备注统计（独立区块，展示当前 viewYear 的备注排行榜）
  function renderYearRank(){
    const box = document.getElementById('yearRankBox');
    const countEl = document.getElementById('yearRankCount');
    const catEl = document.getElementById('yearRankCat');
    box.innerHTML = '';
    const catMap = {};
    Object.keys(data).forEach(k=>{
      if(!k.startsWith(viewYear+'-')) return;
      const items = data[k] || [];
      items.forEach(it=>{
        const key = (it.note && it.note.trim()) ? it.note.trim() : it.name;
        if(!catMap[key]) catMap[key] = { total:0, count:0 };
        catMap[key].total += (Number(it.money)||0);
        catMap[key].count++;
      });
    });
    const keys = Object.keys(catMap).sort((a,b)=> catMap[b].total - catMap[a].total);
    let totalCount = 0;
    keys.forEach(k=>{ totalCount += catMap[k].count; });
    countEl.textContent = totalCount + ' 笔';
    countEl.className = 'val ' + (totalCount>0?'white':'');
    catEl.textContent = keys.length + ' 类';
    catEl.className = 'val ' + (keys.length>0?'white':'');

    if(keys.length === 0){
      box.innerHTML = '<div class="empty-tip">该年暂无记录</div>';
      return;
    }
    const maxTotal = Math.max(...keys.map(k=>Math.abs(catMap[k].total)), 1);
    keys.forEach(key=>{
      const c = catMap[key];
      const pct = Math.max(2, Math.round(Math.abs(c.total) / maxTotal * 100));
      const row = document.createElement('div');
      row.className = 'rank-row';
      row.innerHTML = '<div class="rank-top">' +
          '<div class="rank-name">'+escapeHtml(key)+'</div>' +
          '<div class="rank-count">'+c.count+'笔</div>' +
          '<div class="rank-amt '+dayColor(c.total)+'">'+fmtMoney(c.total)+'</div>' +
        '</div>' +
        '<div class="rank-bar"><div class="fill '+dayColor(c.total)+'" style="width:'+pct+'%"></div></div>';
      box.appendChild(row);
    });
  }

  // 事件
  document.getElementById('prevMonth').addEventListener('click', ()=>{ viewMonth--; if(viewMonth<1){viewMonth=12;viewYear--;} renderCalendar(); updateStats(); renderChart(); renderYearRank(); });
  document.getElementById('nextMonth').addEventListener('click', ()=>{ viewMonth++; if(viewMonth>12){viewMonth=1;viewYear++;} renderCalendar(); updateStats(); renderChart(); renderYearRank(); });
  document.getElementById('addBtn').addEventListener('click', addItem);
  document.getElementById('inputMoney').addEventListener('keydown', e=>{ if(e.key==='Enter') addItem(); });
  document.getElementById('inputNote').addEventListener('keydown', e=>{ if(e.key==='Enter') addItem(); });

  document.getElementById('tabMonth').addEventListener('click', ()=>{
    chartMode = 'month';
    document.getElementById('tabMonth').classList.add('active');
    document.getElementById('tabDay').classList.remove('active');
    renderChart();
  });
  document.getElementById('tabDay').addEventListener('click', ()=>{
    chartMode = 'day';
    document.getElementById('tabDay').classList.add('active');
    document.getElementById('tabMonth').classList.remove('active');
    renderChart();
  });

  document.getElementById('historyYear').addEventListener('change', (e)=>{
    historyYear = Number(e.target.value);
    renderHistory();
  });
  document.getElementById('historyMonth').addEventListener('change', (e)=>{
    historyMonth = Number(e.target.value);
    renderHistory();
  });

  // 数据导出
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '日历记账备份_' + todayStr() + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  // 数据导入
  document.getElementById('importBtn').addEventListener('click', ()=>{
    if(Object.keys(data).length > 0){
      if(!confirm('导入会覆盖当前所有数据，确定继续吗？建议先导出备份。')) return;
    }
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const imported = JSON.parse(ev.target.result);
        if(typeof imported !== 'object' || imported === null){
          alert('文件格式不正确'); return;
        }
        data = imported;
        saveData();
        renderCalendar(); renderDetail(); updateStats(); renderChart(); initHistorySelects(); renderHistory(); renderYearRank();
        alert('导入成功！');
      }catch(err){
        alert('导入失败：文件格式错误');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // 初始化
  initHistorySelects();
  renderHistory();
  renderCalendar();
  renderDetail();
  updateStats();
  renderChart();
  renderYearRank();
})();
</script>
</body>
</html>
